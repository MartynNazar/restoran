{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор вартості — МартинБуд</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1d20; color: #e5e7eb; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar-custom { background-color: #111315 !important; border-bottom: 1px solid rgba(217, 119, 6, 0.3); }
        .card-custom { background-color: #212529; border: 1px solid rgba(27, 54, 93, 0.5); color: #e5e7eb; }
        .form-control, .form-select { background-color: #1a1d20; border-color: #4b5563; color: #fff; }
        .form-control:focus, .form-select:focus { background-color: #1a1d20; color: #fff; border-color: #d97706; box-shadow: none; }
        .btn-copper { background-color: #d97706; color: #fff; font-weight: 600; border: none; }
        .btn-copper:hover { background-color: #b45309; color: #fff; }
        footer { background-color: #111315 !important; border-top: 1px solid rgba(217, 119, 6, 0.2); color: #9ca3af; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3 sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 text-white text-decoration-none fw-bold" href="{% url 'home' %}">
                <img src="{{ MEDIA_URL }}мартинбуд логотип.png" alt="МартинБуд" style="height: 38px; width: auto; object-fit: contain;" onerror="this.style.display='none'">
                <span>МАРТИН<span style="color: #d97706;">БУД</span></span>
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white" href="{% url 'home' %}">← На головну</a>
            </div>
        </div>
    </nav>

    <div class="container my-5" style="max-width: 650px;">
        <div class="card card-custom shadow-lg p-4 rounded-4">
            <h2 class="mb-3 text-center fw-bold" style="color: #d97706; font-family: serif;">Калькулятор кошторису</h2>
            <p class="text-secondary text-center mb-4">Розрахуйте попередню вартість будівельних чи ремонтних робіт.</p>

            <form id="calcForm">
                <div class="mb-3">
                    <label class="form-label fw-semibold text-light">Тип робіт</label>
                    <select id="workType" class="form-select">
                        <option value="2500" class="bg-dark">Косметичний ремонт (від 2500 грн/м²)</option>
                        <option value="4500" selected class="bg-dark">Капітальний ремонт (від 4500 грн/м²)</option>
                        <option value="7000" class="bg-dark">Ремонт «Під ключ» з матеріалами (від 7000 грн/м²)</option>
                        <option value="3500" class="bg-dark">Фасадні / зовнішні роботи (від 3500 грн/м²)</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold text-light">Площа приміщення (м²)</label>
                    <input type="number" id="areaInput" class="form-control" value="50" min="1">
                </div>

                <button type="button" onclick="calculateCost()" class="btn btn-copper w-100 py-2 fs-5 shadow-sm">Розрахувати</button>
            </form>

            <div id="resultBox" class="alert mt-4 text-center fs-5 fw-bold d-none" style="background-color: #2d3748; color: #d97706; border: 1px solid #d97706;" role="alert">
                Орієнтовна вартість: <span id="totalPrice">0</span> грн
            </div>

            <div class="text-center mt-4">
                <a href="{% url 'contact_us' %}" class="text-warning text-decoration-none fw-semibold">Замовити точний розрахунок у фахівця →</a>
            </div>
        </div>
    </div>

    <footer class="text-center py-4 mt-5">
        <div class="container"><p class="mb-0">© 2026 «Мартин Буд».</p></div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function calculateCost() {
            const rate = parseFloat(document.getElementById('workType').value);
            const area = parseFloat(document.getElementById('areaInput').value);
            if (isNaN(area) || area <= 0) { alert('Введіть коректну площу'); return; }
            document.getElementById('totalPrice').innerText = (rate * area).toLocaleString('uk-UA');
            document.getElementById('resultBox').classList.remove('d-none');
        }
    </script>
</body>
</html>
