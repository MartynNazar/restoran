<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація - МартинБуд</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; color: #333; }
        header { background: #2c3e50; color: #fff; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: #fff; text-decoration: none; margin-left: 20px; font-size: 16px; }
        .container { max-width: 500px; margin: 3rem auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        form p { margin-bottom: 15px; }
        form input { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        button { background: #e67e22; color: white; border: none; padding: 10px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <header>
        <h2>МартинБуд</h2>
        <nav>
            <a href="{% url 'home' %}">Головна</a>
            <a href="{% url 'services' %}">Послуги</a>
            <a href="{% url 'register' %}">Реєстрація</a>
        </nav>
    </header>

    <div class="container">
        <h2>Реєстрація нового користувача</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Зареєструватися</button>
        </form>
    </div>
</body>
</html>
