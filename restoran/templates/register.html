{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація / Вхід — МартинБуд</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1d20; color: #e5e7eb; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar-custom { background-color: #111315 !important; border-bottom: 1px solid rgba(217, 119, 6, 0.3); }
        .card-custom { background-color: #212529; border: 1px solid rgba(27, 54, 93, 0.5); color: #e5e7eb; }
        .form-control { background-color: #1a1d20; border-color: #4b5563; color: #fff; }
        .form-control:focus { background-color: #1a1d20; color: #fff; border-color: #d97706; box-shadow: none; }
        footer { background-color: #111315 !important; border-top: 1px solid rgba(217, 119, 6, 0.2); color: #9ca3af; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3 sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 text-white text-decoration-none fw-bold" href="{% url 'home' %}">
                <img src="{{ MEDIA_URL }}мартинбуд логотип.png" alt="МартинБуд" style="height: 38px; width: auto; object-fit: contain;" onerror="this.style.display='none'">
                <span>МАРТИН<span style="color: #d97706;">БУД</span></span>
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white" href="{% url 'home' %}">← На головну</a>
            </div>
        </div>
    </nav>

    <div class="container my-5" style="max-width: 500px;">
        <div class="card card-custom shadow-lg p-4 rounded-4">
            <h2 class="mb-3 text-center fw-bold" style="color: #d97706; font-family: serif;">Реєстрація / Вхід</h2>
            <p class="text-secondary text-center mb-4">Увійдіть у систему або створіть новий акаунт.</p>

            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn w-100 py-2 fw-bold text-white shadow-sm mt-3" style="background-color: #d97706;">Продовжити</button>
            </form>

            <div class="text-center mt-4">
                <a href="{% url 'home' %}" class="text-secondary text-decoration-none">← Повернутися на головну</a>
            </div>
        </div>
    </div>

    <footer class="text-center py-4 mt-5">
        <div class="container"><p class="mb-0">© 2026 «Мартин Буд».</p></div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
